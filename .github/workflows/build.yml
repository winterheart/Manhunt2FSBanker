name: build

on:
  push:
    tags:
      - '\d+\.\d+\.\d+'
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-all:
    runs-on: ${{ matrix.config.os }}
    name: 'Build on ${{ matrix.config.os }} (${{ matrix.config.cxx }})'
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: "ubuntu-latest", cxx: "g++", triplet: "x64-linux" }
          - { os: "ubuntu-latest", cxx: "clang++", triplet: "x64-linux" }
          - { os: "windows-latest", cxx: "cl", triplet: "x64-windows-static-md" }
    env:
      CXX: ${{ matrix.config.cxx }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.config.triplet }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          submodules: 'true'

      - uses: lukka/get-cmake@latest

      - name: "Prepare Windows environment"
        uses: ilammy/msvc-dev-cmd@v1.13.0
        if: ${{ matrix.config.os == 'windows-latest' }}
        with:
          arch: win64

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Run CMake with vcpkg.json manifest
        uses: lukka/run-cmake@v10
        with:
          configurePreset: ninja-multi-vcpkg
          buildPreset: ninja-multi-vcpkg
